[package]
name = "linguaspark-server"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
axum = "0.8"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
isolang = "2"
html5ever = "0.40"
markup5ever_rcdom = "0.40"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.7", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
lingua = { version = "=1.8.0", default-features = false, features = [
    "arabic",
    "chinese",
    "german",
    "english",
    "french",
    "hindi",
    "italian",
    "japanese",
    "korean",
    "dutch",
    "portuguese",
    "russian",
    "spanish",
    "swedish",
    "turkish",
    "vietnamese",
]}
unicode-segmentation = "1.12"

linguaspark = { path = "vendor/linguaspark" }
regex = "1.13.1"

[profile.release]
strip = true
lto = true
codegen-units = 1
